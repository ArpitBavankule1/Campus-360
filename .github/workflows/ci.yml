name: CampusLens AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Lint & Phase Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Next.js Type Definitions
        run: npx next typegen

      - name: TypeScript Static Type Check
        run: npx tsc --noEmit

      - name: Verify Phase 13 (Command Palette & Bookmarks)
        run: node scripts/verify-phase13.mjs

      - name: Verify Phase 14 (Public Website & Features)
        run: node scripts/verify-phase14.mjs

      - name: Verify Phase 15 (Master Security & Schema Audit)
        run: node scripts/verify-phase15.mjs

      - name: Verify Phase 16 (Real-Time Websockets & Broadcasts)
        run: node scripts/verify-phase16.mjs

      - name: Verify Phase 17 (Dynamic Geofenced Attendance)
        run: node scripts/verify-phase17.mjs

      - name: Verify Phase 18 (Facility Bookings & Passes)
        run: node scripts/verify-phase18.mjs

      - name: Verify Phase 19 (Examinations & Transcripts)
        run: node scripts/verify-phase19.mjs

      - name: Verify Phase 20 (Career Placements & TPC)
        run: node scripts/verify-phase20.mjs

      - name: Verify Phase 21 (Student Fees & Digital Payments)
        run: node scripts/verify-phase21.mjs

      - name: Verify Phase 22 (Digital Library & Knowledge Commons)
        run: node scripts/verify-phase22.mjs

      - name: Verify Phase 23 (Campus Hostel & Residence Management)
        run: node scripts/verify-phase23.mjs

      - name: Verify Phase 24 (Health Center & Emergency SOS)
        run: node scripts/verify-phase24.mjs

      - name: Verify Phase 25 (Student Clubs & Activity Merit Ledger)
        run: node scripts/verify-phase25.mjs

      - name: Verify Phase 26 (Alumni Network & Mentorship Nexus)
        run: node scripts/verify-phase26.mjs

      - name: Verify Phase 27 (Smart Campus Transport & EV Shuttles)
        run: node scripts/verify-phase27.mjs

      - name: Verify Phase 28 (Research Publications & Innovation Hub)
        run: node scripts/verify-phase28.mjs

      - name: Verify Phase 29 (International Scholars & Global Mobility)
        run: node scripts/verify-phase29.mjs

      - name: Verify Phase 30 (Smart Campus Sustainability & Green Energy)
        run: node scripts/verify-phase30.mjs

      - name: Verify Phase 31 (Campus Grievance Redressal & Ombudsman)
        run: node scripts/verify-phase31.mjs

      - name: Verify Phase 32 (Smart Campus Sports Arena & Athletics)
        run: node scripts/verify-phase32.mjs

      - name: Verify Phase 33 (Campus Incubation & Startup Accelerator)
        run: node scripts/verify-phase33.mjs

      - name: Verify Phase 34 (Smart Campus Security & Command Hub)
        run: node scripts/verify-phase34.mjs

      - name: Verify Phase 35 (Smart Campus Cafeteria & Dining Wallets)
        run: node scripts/verify-phase35.mjs

      - name: Verify Phase 36 (Smart Campus Auditorium & Convention Hub)
        run: node scripts/verify-phase36.mjs

      - name: Verify Phase 37 (Smart Campus Scholarships & Financial Aid)
        run: node scripts/verify-phase37.mjs

      - name: Verify Phase 38 (Convocation & Degree Credentials)
        run: node scripts/verify-phase38.mjs

      - name: Verify Phase 39 (Student Elections & E-Voting)
        run: node scripts/verify-phase39.mjs

      - name: Verify Phase 40 (Cloud Printing & Thesis Binding)
        run: node scripts/verify-phase40.mjs

      - name: Verify Phase 41 (Mental Health & Counseling Sanctuary)
        run: node scripts/verify-phase41.mjs

      - name: Verify Master Security & Anti-Injection Suite
        run: node scripts/verify-security.mjs

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://campuslens.ai"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key"
